openapi: 3.2.0
info:
  title: Petra Security Usage Xlsx API
  description: The Petra Security API provides programmatic access to security data and functionality within your Petra portal.
  version: 1.0.0
  contact:
    name: Petra Security Support
    email: support@petrasecurity.com
servers:
- url: https://api.petrasecurity.com
  description: Production server
security:
- bearerAuth: []
tags:
- name: Usage Xlsx
paths:
  /v1/usage-xlsx:
    get:
      summary: Download usage spreadsheet
      description: Download a tenant usage report as an Excel (.xlsx) spreadsheet. This endpoint uses a Multi-MSP API Key for authentication rather than a standard Org API Key.
      operationId: getUsageXlsx
      parameters:
      - name: month
        in: query
        required: false
        description: Month in YYYY-MM format (e.g. 2026-03) to generate the usage report for. Defaults to the current month if not provided.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
      responses:
        '200':
          description: Excel spreadsheet containing tenant usage data
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - Invalid or missing Multi-MSP API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests - Rate limit exceeded for this route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      tags:
      - Usage Xlsx
components:
  schemas:
    ErrorResponse: {}
